<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- title は読み込み中に見えるもの。読み込めたら JS が書き換える -->
  <title>ヘルプ | イベクリ</title>
  <meta name="description" content="イベクリの使い方のヘルプ（カテゴリ）です。">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/common/evecre-icon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/common/evecre-icon-192.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="module" src="/assets/js/pages/help-category.js"></script>
</head>
<body>
  <header class="l-header">
    <nav class="l-header__nav" aria-label="サイト内">
      <ul class="l-header__list">
        <li class="l-header__item"><a class="l-header__link" href="/">TOP</a></li>
        <li class="l-header__item"><a class="l-header__link" href="https://evecre-ver-2-2-1.onrender.com/explore" data-explore-link>みんなの記録</a></li>
        <li class="l-header__item"><a class="l-header__link" href="/pages/help/" aria-current="true">ヘルプ</a></li>
      </ul>
    </nav>
  </header>

  <main class="l-main">
    <section class="p-help-category">
      <!-- 検索：ヘルプのトップに ?q= で送る（JS が無くても動く） -->
      <form class="c-help-search c-help-search--compact" action="/pages/help/" method="get" role="search">
        <input class="c-help-search__input" type="search" name="q" placeholder="キーワードで検索" aria-label="ヘルプを検索" data-help-search-input>
        <button class="c-help-search__button" type="submit">検索</button>
      </form>

      <nav class="c-breadcrumb" aria-label="現在地">
        <ol class="c-breadcrumb__list">
          <li class="c-breadcrumb__item"><a class="c-breadcrumb__link" href="/pages/help/">ヘルプ トップ</a></li>
          <li class="c-breadcrumb__item" aria-current="page" data-help="crumbCurrent"></li>
        </ol>
      </nav>

      <p class="p-help-category__message" data-help-message role="status">読み込み中…</p>

      <div class="p-help-category__content u-hidden" data-help-content>
        <h1 class="p-help-category__title" data-help="title"></h1>
        <p class="p-help-category__description" data-help="description"></p>
        <ul class="c-help-list" data-help="list"></ul>
      </div>

      <a class="p-help-category__back" href="/pages/help/">ヘルプ トップへ戻る</a>
    </section>
  </main>

  <!-- 記事の一覧の1件（検索結果・カテゴリ）。help.js の buildArticleItem() が複製する
       JS が探すのは data-help-item="…" だけ。クラスは見た目のためのもので、変えてよい -->
  <template data-help-item-template>
    <li class="c-help-list__item">
      <a class="c-help-list__link" href="" data-help-item="link">
        <span class="c-help-list__title" data-help-item="title"></span>
        <span class="c-help-list__summary" data-help-item="summary"></span>
      </a>
    </li>
  </template>

  <footer class="l-footer">
    <small class="l-footer__copyright">&copy; イベクリ</small>
  </footer>
</body>
</html>
