<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- title は読み込み中に見えるもの。読み込めたら JS が書き換える -->
  <title>ヘルプ | イベクリ</title>
  <meta name="description" content="イベクリの使い方のヘルプです。キーワードで検索するか、カテゴリから探せます。">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/common/evecre-icon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/common/evecre-icon-192.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="module" src="/assets/js/pages/help-top.js"></script>
</head>
<body>
  <header class="l-header">
    <!-- TODO: ロゴ画像（assets/img/common/）に差し替える -->
    <a class="l-header__logo" href="/">イベクリ</a>
    <nav class="l-header__nav" aria-label="サイト内">
      <ul class="l-header__list">
        <li class="l-header__item"><a class="l-header__link" href="/">Top</a></li>
        <li class="l-header__item"><a class="l-header__link" href="https://evecre-ver-2-2-1.onrender.com/explore" data-explore-link>みんなの記録</a></li>
        <li class="l-header__item"><a class="l-header__link" href="/pages/help/" aria-current="page">ヘルプ</a></li>
      </ul>
    </nav>
  </header>

  <main class="l-main">
    <section class="p-help-top">
      <div class="p-help-top__hero">
        <h1 class="p-help-top__title">なにかお困りですか？</h1>
      <!-- 検索：ヘルプのトップに ?q= で送る（JS が無くても動く） -->
      <form class="c-help-search" action="/pages/help/" method="get" role="search">
        <input class="c-help-search__input" type="search" name="q" placeholder="キーワードで検索" aria-label="ヘルプを検索" data-help-search-input>
        <button class="c-help-search__button" type="submit">検索</button>
      </form>
      </div>

      <p class="p-help-top__message" data-help-message role="status">読み込み中…</p>

      <!-- 検索したときだけ出す（?q=） -->
      <section class="p-help-top__results u-hidden" data-help-results aria-labelledby="help-results-title">
        <h2 class="p-help-top__heading" id="help-results-title" data-help-results-title></h2>
        <ul class="c-help-list" data-help-results-list></ul>
        <p class="p-help-top__empty u-hidden" data-help-results-empty>見つかりませんでした。別の言葉で探すか、下のカテゴリから探してください。</p>
      </section>

      <section class="p-help-top__categories u-hidden" data-help-categories aria-labelledby="help-categories-title">
        <h2 class="p-help-top__heading" id="help-categories-title">カテゴリから探す</h2>
        <ul class="p-help-top__category-list" data-help-category-list></ul>
      </section>
    </section>
  </main>

  <!-- カテゴリ1つ。help-top.js が複製する。JS が探すのは data-help-category="…" だけ -->
  <template data-help-category-template>
    <li class="p-help-top__category">
      <a class="p-help-top__category-link" href="" data-help-category="link">
        <span class="p-help-top__category-label" data-help-category="label"></span>
        <span class="p-help-top__category-description" data-help-category="description"></span>
      </a>
    </li>
  </template>

  <!-- 記事の一覧の1件（検索結果・カテゴリ）。help.js の buildArticleItem() が複製する
       JS が探すのは data-help-item="…" だけ。クラスは見た目のためのもので、変えてよい -->
  <template data-help-item-template>
    <li class="c-help-list__item">
      <a class="c-help-list__link" href="" data-help-item="link">
        <span class="c-help-list__title" data-help-item="title"></span>
        <span class="c-help-list__summary" data-help-item="summary"></span>
      </a>
    </li>
  </template>

  <footer class="l-footer">
    <small class="l-footer__copyright">&copy; イベクリ</small>
  </footer>
</body>
</html>
